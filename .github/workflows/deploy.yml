name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  # ── Frontend: build and rsync dist/ to the VPS ──────────────────────────────
  deploy:
    name: Frontend to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort only. The rsync below passes StrictHostKeyChecking=no,
          # so a populated known_hosts is a nicety, not a requirement — but the
          # step runs under `bash -e`, so a transient ssh-keyscan failure used
          # to abort the whole deploy AFTER a successful build. That is exactly
          # what happened on 841b40d: the build passed, this line exited 1, the
          # rsync never ran, and production silently stayed on the old bundle.
          ssh-keyscan -H 72.62.174.193 >> ~/.ssh/known_hosts || \
            echo "ssh-keyscan failed; continuing (rsync does not require it)"

      - name: Rsync dist to VPS
        run: |
          # Retry: a single dropped connection should not mean a silently
          # un-deployed fix. Fails loudly if all three attempts fail.
          for attempt in 1 2 3; do
            if rsync -avz --delete \
                 -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
                 dist/ root@72.62.174.193:/var/www/ledger.90ten.life/; then
              exit 0
            fi
            echo "rsync attempt $attempt failed"
            sleep $((attempt * 5))
          done
          echo "::error::rsync failed after 3 attempts — production was NOT updated"
          exit 1

  # ── VPS poller ──────────────────────────────────────────────────────────────
  # Why this job exists: scripts/poll_email_inbox.py has been a HAND-COPIED
  # file for its whole life, and that cost real outages. v13.9's fix shipped in
  # two halves -- the poller went to the VPS, the edge function never did --
  # and PDF receipts came back blank for a month with nothing reporting it.
  # The repo is the source of truth (CLAUDE.md); this makes the VPS agree with
  # it on every merge instead of whenever somebody remembers.
  #
  # Safe to run on every push: rsync is a no-op when the file is unchanged, and
  # cron picks up the new file on its next tick -- there is no service to
  # restart. It will overwrite a hand-edit made directly on the box, which is
  # the intended behaviour, not a side effect.
  poller:
    name: Poller to VPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy poller to /opt/ledgerx
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          for attempt in 1 2 3; do
            if rsync -avz -e "$SSH" \
                 scripts/poll_email_inbox.py \
                 root@72.62.174.193:/opt/ledgerx/poll_email_inbox.py; then
              exit 0
            fi
            echo "rsync attempt $attempt failed"
            sleep $((attempt * 5))
          done
          echo "::error::poller rsync failed after 3 attempts — the VPS is still on the OLD script"
          exit 1

      - name: Verify it compiles on the VPS
        # A syntactically broken poller fails silently: cron swallows the
        # traceback into a log nobody reads and email ingestion just stops.
        # Compile it in the same venv cron uses, and fail the deploy if it
        # does not import.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@72.62.174.193 \
            '/opt/ledgerx/venv/bin/python3 -m py_compile /opt/ledgerx/poll_email_inbox.py' \
            && echo "poller compiles on the VPS"

  # ── Supabase edge functions ─────────────────────────────────────────────────
  # Deploys only the functions whose source changed in this push. HEAD^ on a
  # merge commit is the previous main, so the diff is exactly what the merge
  # introduced.
  #
  # The CLI reads verify_jwt from supabase/config.toml, which until now was
  # decorative on this project -- there was no CLI, so every dashboard-created
  # function needed its toggle set by hand, and whatsapp-send spent weeks
  # 401ing once a minute because nobody did. Deploying this way makes that file
  # authoritative at last.
  #
  # Skips cleanly when SUPABASE_ACCESS_TOKEN is not set, so adding this job
  # cannot break the deploy before the secret exists.
  edge-functions:
    name: Edge functions to Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for credentials
        id: creds
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — edge functions NOT deployed. Deploy them by hand in the dashboard, or add the secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out which functions changed
        if: steps.creds.outputs.ready == 'true'
        id: changed
        run: |
          # Any change under a function's directory redeploys that function.
          # config.toml is global, so a change there redeploys everything --
          # that file carries verify_jwt, and a stale toggle is exactly the
          # silent-401 failure this job is meant to end.
          # A shallow or first commit has no HEAD^ — deploy everything rather
          # than silently deploying nothing, which is the failure mode that
          # would quietly reintroduce repo/production drift.
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            FNS=$(ls supabase/functions)
            echo "no parent commit available — redeploying all functions"
          elif git diff --name-only HEAD^ HEAD | grep -q '^supabase/config\.toml$'; then
            FNS=$(ls supabase/functions)
            echo "config.toml changed — redeploying all functions"
          else
            FNS=$(git diff --name-only HEAD^ HEAD \
                  | grep '^supabase/functions/' \
                  | cut -d/ -f3 | sort -u)
          fi
          echo "functions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FNS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Will deploy: ${FNS:-<none>}"

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: bkxccrbfjoqtxbtekrgw
        run: |
          FNS="${{ steps.changed.outputs.functions }}"
          if [ -z "$(echo "$FNS" | tr -d '[:space:]')" ]; then
            echo "No edge function changed in this push — nothing to deploy."
            exit 0
          fi
          FAILED=""
          for fn in $FNS; do
            [ -f "supabase/functions/$fn/index.ts" ] || continue
            echo "::group::deploy $fn"
            # verify_jwt comes from supabase/config.toml, not from here.
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" || FAILED="$FAILED $fn"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::failed to deploy:$FAILED"
            exit 1
          fi
